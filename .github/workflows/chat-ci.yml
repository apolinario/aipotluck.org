name: chat-ci

# Gate the chat surface (chat-svelte/ — the canonical SvelteKit chat) on every
# push/PR with svelte-check (TypeScript + Svelte correctness). No DB, no secrets.
#
# Scope note: this gates types only, NOT lint or unit tests, on purpose.
#   - Lint (`npm run lint` = prettier --check + eslint) is currently RED on the
#     committed tree (format drift + a handful of no-explicit-any/no-unused-vars).
#     Cleaning it is a separate pass; until then it stays on the husky pre-commit
#     hook (lint-staged formats staged files), not in CI.
#   - Unit tests (`npm test`) need a live Postgres + a synthesized .env (the server
#     specs are DB-integration and the test setup reads ./.env at import). Gating
#     those needs a Postgres service container — a deliberate follow-up, not here.
#
# The legacy Next app under chat/ is frozen (preserved on the ai-potluck-chat
# branch); it is not gated here anymore.

on:
  push:
    branches: [chat-ui-migration, main]
  pull_request:

defaults:
  run:
    working-directory: chat-svelte

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-svelte/package-lock.json
      # The committed package-lock.json is an npm-11 lockfile (matches local dev).
      # node 22's bundled npm is 10, which reports the lock out-of-sync (missing
      # @csstools/* entries) and fails `npm ci`. Pin npm 11 to match the lock.
      - run: npm install -g npm@11
      - run: npm ci
        env:
          HUSKY: 0 # skip the husky `prepare` hook install in CI
      - run: npm run check # svelte-kit sync + svelte-check (types + Svelte)
